<!DOCTYPE html>
<html>
<head>
    <title>Memory Match Game</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #667eea, #764ba2, #ff6ec4);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        h1 {
            margin-top: 20px;
            color: white;
        }

        .game-board {
            width: 440px;
            margin: 30px auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .card {
            width: 100px;
            height: 100px;
            background: white;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 6px 10px rgba(0,0,0,0.3);
            overflow: hidden;
            position: relative;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card img {
            width: 80px;
            height: 80px;
            display: none;
        }

        .card.flipped img {
            display: block;
        }

        .card.matched {
            background: #a1ffce;
        }

        #moves {
            color: white;
            font-size: 20px;
            margin-top: 10px;
        }

        #message {
            font-size: 22px;
            color: yellow;
            font-weight: bold;
            margin-top: 10px;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            background-color: #ff6f61;
            color: white;
        }

        button:hover {
            background-color: #ff3b2e;
        }

        a {
            color: white;
            text-decoration: none;
        }

    </style>
</head>

<body>

<h1>Memory Match Game</h1>
<p style="color:white;">Match all identical images</p>

<div class="game-board" id="gameBoard"></div>

<div id="moves">Moves: 0</div>
<div id="message"></div>

<button onclick="startGame()">Restart Game</button>
<br><br>
<a href="index.html">Back to Home</a>

<script>

const images = [
    "apple.png",
    "banana.png",
    "grape.png",
    "strawberry.png"
];

let cardsArray = [];
let firstCard = null;
let secondCard = null;
let lockBoard = false;
let moves = 0;
let matches = 0;

function shuffle(array) {
    return array.sort(() => 0.5 - Math.random());
}

function startGame() {

    const board = document.getElementById("gameBoard");
    board.innerHTML = "";

    cardsArray = shuffle([...images, ...images]);

    firstCard = null;
    secondCard = null;
    lockBoard = false;
    moves = 0;
    matches = 0;

    document.getElementById("moves").innerHTML = "Moves: 0";
    document.getElementById("message").innerHTML = "";

    cardsArray.forEach((imgName) => {

        const card = document.createElement("div");
        card.classList.add("card");

        const img = document.createElement("img");
        img.src = "images/" + imgName;

        card.appendChild(img);
        card.addEventListener("click", flipCard);

        board.appendChild(card);
    });
}

function flipCard() {

    if (lockBoard) return;
    if (this === firstCard) return;
    if (this.classList.contains("matched")) return;

    this.classList.add("flipped");

    if (!firstCard) {
        firstCard = this;
        return;
    }

    secondCard = this;
    moves++;
    document.getElementById("moves").innerHTML = "Moves: " + moves;

    checkMatch();
}

function checkMatch() {

    const img1 = firstCard.querySelector("img").src;
    const img2 = secondCard.querySelector("img").src;

    if (img1 === img2) {

        firstCard.classList.add("matched");
        secondCard.classList.add("matched");
        matches++;

        if (matches === 4) {
            document.getElementById("message").innerHTML = "Fantastic! All pairs matched!";
        }

        resetCards();

    } else {

        lockBoard = true;

        setTimeout(() => {
            firstCard.classList.remove("flipped");
            secondCard.classList.remove("flipped");
            resetCards();
        }, 800);
    }
}

function resetCards() {
    firstCard = null;
    secondCard = null;
    lockBoard = false;
}

startGame();

</script>

</body>
</html>
