<!DOCTYPE html>
<html>
<head>
    <title>Color Matching Game</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(to right, #f6d365, #fda085);
        }

        h1 {
            margin-top: 30px;
            color: #333;
        }

        .container {
            display: flex;
            justify-content: center;
            margin-top: 40px;
            gap: 80px;
        }

        .colors, .targets {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            cursor: grab;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .target {
            width: 120px;
            height: 80px;
            border: 3px dashed #333;
            border-radius: 10px;
            line-height: 80px;
            font-weight: bold;
            background-color: white;
        }

        #score {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        #message {
            margin-top: 15px;
            font-size: 22px;
            color: green;
            font-weight: bold;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background-color: #333;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: black;
        }

    </style>
</head>

<body>

<h1>Color Matching Game</h1>
<p>Drag the colored circle into the matching color box</p>

<div class="container">

    <div class="colors">
        <div class="circle" draggable="true" id="red" style="background:red;"></div>
        <div class="circle" draggable="true" id="blue" style="background:blue;"></div>
        <div class="circle" draggable="true" id="green" style="background:green;"></div>
        <div class="circle" draggable="true" id="yellow" style="background:yellow;"></div>
    </div>

    <div class="targets">
        <div class="target" data-color="red">RED</div>
        <div class="target" data-color="blue">BLUE</div>
        <div class="target" data-color="green">GREEN</div>
        <div class="target" data-color="yellow">YELLOW</div>
    </div>

</div>

<div id="score">Score: 0</div>
<div id="message"></div>

<button onclick="resetGame()">Reset Game</button>
<br><br>
<a href="index.html">Back to Home</a>

<script>

let score = 0;
const circles = document.querySelectorAll('.circle');
const targets = document.querySelectorAll('.target');
const message = document.getElementById("message");

circles.forEach(circle => {
    circle.addEventListener("dragstart", dragStart);
});

targets.forEach(target => {
    target.addEventListener("dragover", dragOver);
    target.addEventListener("drop", drop);
});

function dragStart(e) {
    e.dataTransfer.setData("color", e.target.id);
}

function dragOver(e) {
    e.preventDefault();
}

function drop(e) {
    e.preventDefault();
    const draggedColor = e.dataTransfer.getData("color");
    const targetColor = e.target.getAttribute("data-color");

    if (draggedColor === targetColor) {
        e.target.style.backgroundColor = draggedColor;
        document.getElementById(draggedColor).style.visibility = "hidden";
        score++;
        document.getElementById("score").innerHTML = "Score: " + score;

        if (score === 4) {
            message.innerHTML = "Excellent! All colors matched!";
        }
    }
}

function resetGame() {
    score = 0;
    document.getElementById("score").innerHTML = "Score: 0";
    message.innerHTML = "";

    circles.forEach(circle => {
        circle.style.visibility = "visible";
    });

    targets.forEach(target => {
        target.style.backgroundColor = "white";
    });
}

</script>

</body>
</html>
